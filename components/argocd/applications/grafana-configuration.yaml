apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana-configuration
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2" 
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:

  - repoURL: git@github.com:marranz/k8s-local-env.git
    path: components/grafana-configuration/
    name: manifests

  destination:
    server: https://kubernetes.default.svc
    namespace: grafana

  syncPolicy:
    automated:
      prune: false
      selfHeal: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

